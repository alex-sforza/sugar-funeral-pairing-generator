<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Funeral — V6 Full Song Matrix</title><style>
body{font-family:system-ui,sans-serif;max-width:1180px;margin:auto;padding:24px;background:#f5f0ec;color:#241d20}.head,.card{background:#fff;border-radius:16px;padding:20px;margin:0 0 16px;box-shadow:0 3px 18px #0001}h1{margin:0 0 6px}.muted,.why{color:#70666a}.controls{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#241d20;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.song{padding:9px 0;border-bottom:1px solid #eee}.score{font-weight:800;font-size:18px}.pill{display:inline-block;background:#eee8e5;border-radius:99px;padding:4px 8px;margin:3px;font-size:12px}.bar{height:7px;background:#e8e2df;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#241d20}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="head"><h1>SUGAR FUNERAL · FULL SONG MATRIX V6</h1><div class="muted">69 песен · эмоции + динамика + сюжетные маркеры + мотивы. Тип пейринга не участвует в выборе песни.</div><p id="status">Загрузка базы…</p><div class="controls"><button onclick="runControls()">▶ ВСЕ КОНТРОЛЬНЫЕ</button><button onclick="runRandom()">✦ 10 СЛУЧАЙНЫХ</button><button onclick="clearOut()">× ОЧИСТИТЬ</button></div></div><div id="out"></div>
<script>
let songs=[],profiles=[];
const E=['romance','passion','obsession','danger','tenderness','tragedy','chaos'];
const D=['rivalry','mystery','devotion','power','healing','rebellion','play','doom','predator','intimacy','crime','distance'];
const M={
'devotion':['devotion','loyalty','partnership','sacrifice','trust','eternity','healing'],
'forbidden':['forbidden-attraction','forbidden-love','secret-date','secret-connection','rule-breakers','danger','escape'],
'toxic':['toxic-romance','toxic-attraction','toxic-cycle','mutual-destruction','addictive-romance','mutual-obsession','red-flags','possessive-love','possessive-romance'],
'predator':['monster-romance','predator-and-devotee','predatory-romance','hunt-and-hunted','killer-romance','gentle-danger','dangerous-romance','fatal-attraction'],
'slow':['slow-burn','guarded-heart','pursuit','sensual-romance','intimacy','friends-to-lovers','tension'],
'crime':['partners-in-crime','runaways','cop-and-criminal','spy-romance','cat-and-mouse'],
'power':['power-dynamic','power-couple','power-struggle','mind-games','provocation','workplace-romance','rivals-to-lovers','competition'],
'healing':['hurt-comfort','healing-romance','healing','mutual-healing','pattern-breaking','second-chance'],
'doom':['doomed-romance','last-night','destructive-love','eternal-devotion','finality','farewell'],
'chaos':['chaotic-romance','chaotic-attraction','holiday-chaos','playful-danger','playful-romance','escape','wild-romance'],
'mystery':['mystery-romance','secret-identities','secret-connection','fate','wish-romance'],
'distance':['long-distance-romance','loneliness','memory','exes','unrequited-love','bittersweet']};
const tagDim={
rivalry:['rivals-to-lovers','mind-games','power-struggle','competition','cat-and-mouse'],mystery:['mystery-romance','secret-identities','secret-connection','fate'],devotion:['devoted-love','eternal-love','devotion','protective-romance','battle-couple','healing-romance','soulmates','acceptance','power-couple','creation-and-devotion'],power:['power-dynamic','power-couple','power-struggle','provocation','workplace-romance','rivals-to-lovers'],healing:['hurt-comfort','healing-romance','healing','mutual-healing','pattern-breaking','second-chance','acceptance'],rebellion:['rule-breakers','runaways','rebellious-romance','escape','destructive-love'],play:['playful-romance','playful-danger','chaotic-romance','mind-games','flirty-romance','holiday-flirt','comedic-kink'],doom:['doomed-romance','last-night','destructive-love','finality','farewell','eternal-devotion'],predator:['monster-romance','predator-and-devotee','predatory-romance','hunt-and-hunted','killer-romance','dangerous-romance','fatal-attraction'],intimacy:['sensual-romance','intimacy','slow-burn','secret-date','mutual-desire','possessive-romance'],crime:['partners-in-crime','cop-and-criminal','spy-romance','killer-romance'],distance:['long-distance-romance','loneliness','memory','exes','unrequited-love','bittersweet']};
const presets={
'⚔️ Враги → любовники':{rivalry:10,power:8,passion:9,obsession:6,danger:7,intimacy:6},'🤍 Hurt × comfort':{healing:10,tenderness:10,devotion:9,tragedy:6,intimacy:8},'🖤 Токсичная одержимость':{obsession:10,danger:10,power:8,predator:8,passion:10,intimacy:8},'🔥 Сообщники':{crime:10,rebellion:9,play:8,chaos:9,devotion:7},'🥀 Обречённая любовь':{doom:10,tragedy:10,romance:10,devotion:8,distance:7},'🔒 Запретная связь':{mystery:10,rebellion:8,danger:8,intimacy:8,romance:8},'🌙 Slow burn':{slow:10,intimacy:9,devotion:8,mystery:5,tenderness:8,passion:7},'🩸 Монстр × принимающий':{predator:10,devotion:8,acceptance:10,intimacy:8,danger:8},'♟️ Власть × власть':{power:10,rivalry:9,play:8,passion:9,intimacy:7},'🌫️ Тайный роман':{mystery:10,distance:7,intimacy:8,devotion:7,romance:9},'🎲 Хаотичная пара':{chaos:10,play:10,rebellion:9,crime:6,passion:8},'🛡️ Защитник':{devotion:10,healing:7,intimacy:8,tenderness:10,danger:5}};
const dimToE={acceptance:{tenderness:8,romance:8},chaos:{chaos:10},predator:{danger:8,obsession:7},crime:{danger:7,chaos:7},doom:{tragedy:10,romance:8},distance:{tragedy:6,obsession:5},healing:{tenderness:9,romance:8},intimacy:{romance:8,passion:8,obsession:5},mystery:{obsession:6,danger:5},power:{passion:8,obsession:7,danger:6},rebellion:{chaos:8,danger:7},rivalry:{passion:8,chaos:6},play:{chaos:8,passion:7},devotion:{romance:9,tenderness:8},slow:{romance:9,tenderness:8,passion:6}};
function songMatrix(s,p){let out={};D.forEach(d=>out[d]=5);const tags=[...(s.pairing_types||[]),...(s.themes||[])];for(const d of D){let hits=(tagDim[d]||[]).filter(x=>tags.includes(x)).length;out[d]=Math.min(10,5+hits*2.1)}return out}
function getProfile(title){return profiles.find(x=>x.title===title)||Object.fromEntries(E.map(k=>[k,5]))}
function pairProfile(base){let p=Object.fromEntries(E.map(k=>[k,5]));let d=Object.fromEntries(D.map(k=>[k,5]));for(const [k,v] of Object.entries(base)){if(k in d)d[k]=v;else if(k in p)p[k]=v;else if(dimToE[k]){d[k]=v;for(const [e,x] of Object.entries(dimToE[k]))p[e]=Math.max(p[e],Math.min(10,x))}}return {e:p,d}}
function scoreSong(s,pp){let ep=getProfile(s.title),sm=songMatrix(s,pp),e=0,d=0;for(const k of E)e+=1-Math.abs(pp.e[k]-ep[k])/10;for(const k of D)d+=1-Math.abs(pp.d[k]-sm[k])/10;let tags=[...(s.pairing_types||[]),...(s.themes||[])];let wanted=Object.entries(pp.d).filter(([,v])=>v>=8).map(([k])=>tagDim[k]||[]).flat();let hit=wanted.filter(x=>tags.includes(x)).length;let specificity=Math.min(1,hit/Math.max(3,wanted.length*.12));return {total:100*(.48*e/E.length+.32*d/D.length+.12*specificity+.08*(Math.min(10,pp.e.passon||5)/10)),e:100*e/E.length,d:100*d/D.length,sp:100*specificity}}
function classify(pp){return Object.entries(presets).map(([name,x])=>{let q=0,n=0;for(const [k,v] of Object.entries(x)){if(pp.d[k]!=null){q+=Math.min(v,pp.d[k]);n+=v}else if(pp.e[k]!=null){q+=Math.min(v,pp.e[k]);n+=v}}return [name,100*q/n]}).sort((a,b)=>b[1]-a[1]).slice(0,3)}
function render(name,raw){let pp=pairProfile(raw),cl=classify(pp),rank=songs.map(s=>({s,...scoreSong(s,pp)})).sort((a,b)=>b.total-a.total).slice(0,7);return `<div class="card"><h2>${name}</h2><p><b>TOP-3 динамики:</b> ${cl.map((x,i)=>`${i+1}. ${x[0]} — ${x[1].toFixed(0)}%`).join(' · ')}</p>${rank.map((x,i)=>`<div class="song"><span class="score">${i+1}. ${x.s.title} — ${x.total.toFixed(1)}</span><div class="bar"><i style="width:${x.total}%"></i></div><div class="why">эмоции ${x.e.toFixed(1)} · динамика ${x.d.toFixed(1)} · сюжет/специфика ${x.sp.toFixed(1)}</div></div>`).join('')}</div>`}
function randomProfile(){let p={};for(const k of E)p[k]=+(Math.random()*10).toFixed(1);for(const k of D)p[k]=+(Math.random()*10).toFixed(1);return p}
function runControls(){document.getElementById('out').innerHTML=Object.entries(presets).map(([n,p])=>render(n,p)).join('')}
function runRandom(){document.getElementById('out').innerHTML=Array.from({length:10},(_,i)=>render('🎲 Случайная пара #'+(i+1),randomProfile())).join('')}
function clearOut(){document.getElementById('out').innerHTML=''}
async function load(){try{let [a,b]=await Promise.all([fetch('data/sugar-funeral-songs.json').then(r=>r.json()),fetch('data/song-profiles.json').then(r=>r.json())]);songs=a.songs;profiles=b.profiles;document.getElementById('status').innerHTML=`Загружено: <b>${songs.length} песен</b> · эмоциональных паспортов: <b>${profiles.length}</b> · матрица V6 готова.`}catch(e){document.getElementById('status').textContent='Ошибка загрузки базы: '+e.message}}load();
</script></body></html>
