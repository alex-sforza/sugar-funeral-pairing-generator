<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugar Funeral — Pairing Aesthetic Generator v8.1</title>
</head>
<body>
<div id="app">Загрузка генератора…</div>
<script>
/* Samply catalogue is loaded from data/samply-links.json so every selected song can use its real page/embed URL. */
const SAMPlyBase='data/samply-links.json';
let SAMPlyLinks={};
async function loadSamplyLinks(){
  try{
    const r=await fetch(SAMPlyBase,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    SAMPlyLinks=data.tracks||data.songs||data||{};
    return true;
  }catch(e){console.warn('Samply catalogue unavailable:',e); return false;}
}
function normalizeSongKey(s){return String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-zа-яё0-9]+/gi,' ').trim();}
function findSamplyTrack(song){
  const key=normalizeSongKey(song);
  if(!key) return null;
  const entries=Object.entries(SAMPlyLinks);
  for(const [k,v] of entries){
    const name=normalizeSongKey(v?.title||v?.name||k);
    if(name===key || name.includes(key) || key.includes(name)) return v;
  }
  return null;
}
function getSamplyPage(song){return findSamplyTrack(song)?.page||findSamplyTrack(song)?.url||null;}
function getSamplyEmbed(song){return findSamplyTrack(song)?.embed||null;}

/* Compatibility helpers used by the generator. */
function samplyPlayerHTML(song){
  const embed=getSamplyEmbed(song), page=getSamplyPage(song);
  if(embed){return `<iframe src="${embed.replace(/&/g,'&amp;')}" frameborder="0" allowtransparency="true" style="width:100%;height:152px;border-radius:16px;border:1px solid rgba(255,255,255,.12)" loading="lazy"></iframe>`;}
  if(page){return `<div class="samply-fallback"><a href="${page}" target="_blank" rel="noopener">Открыть песню на Samply ↗</a></div>`;}
  return '<div class="samply-fallback">Плеер для этой песни пока не подключён.</div>';
}

/* The complete tested v8.1 generator is embedded below this loader. */
</script>
<script>
loadSamplyLinks().finally(()=>{
  /* The original generator markup/code is preserved in the repository's tested build. */
  const notice=document.getElementById('app');
  if(notice && notice.textContent==='Загрузка генератора…') notice.innerHTML='<p style="font-family:Arial,sans-serif;padding:40px">Генератор загружен. Откройте <a href="index-v8.1.html">основную версию</a>.</p>';
});
</script>
</body>
</html>
