<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sugar Funeral — тестовый генератор</title>
<style>
body{font-family:Arial,sans-serif;max-width:980px;margin:0 auto;padding:24px;background:#f4f0ee;color:#241d20}h1{margin-bottom:6px}p{color:#665c60}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 3px 15px #0001}.wide{grid-column:1/-1}label{display:block;margin:10px 0 5px;font-weight:700}select,input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{padding:12px 20px;border:0;border-radius:9px;cursor:pointer;font-weight:700;margin-top:15px}.result{margin-top:18px}.song{font-size:28px;font-weight:800}.quote{font-size:20px;font-style:italic;margin:12px 0}.score{font-size:13px;color:#766b70}.reason{margin:4px 0}.tests{font-family:monospace;white-space:pre-wrap;background:#211b1e;color:#eee;padding:15px;border-radius:10px;overflow:auto}.ok{color:green}.warn{color:#a05a00}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<h1>SUGAR FUNERAL</h1>
<p>Тестовый генератор подбора песни по динамике отношений. Это технический стенд — пока без финальной эстетики.</p>
<div class="grid">
<section class="card">
<h2>Динамика</h2>
<label>Основной тип</label>
<select id="type">
<option value="enemies-to-lovers">Враги → любовники</option>
<option value="forbidden-attraction">Запретное влечение</option>
<option value="toxic-attraction">Токсичное влечение</option>
<option value="partners-in-crime">Сообщники</option>
<option value="slow-burn">Медленное сближение</option>
<option value="doomed-romance">Обречённый роман</option>
<option value="hurt-comfort">Боль и исцеление</option>
<option value="monster-romance">Влюбиться в чудовище</option>
<option value="mutual-obsession">Взаимная одержимость</option>
<option value="rivals-to-lovers">Соперники → любовники</option>
</select>
<label>Тема</label>
<select id="theme">
<option value="jealousy">Ревность</option>
<option value="obsession">Одержимость</option>
<option value="danger">Опасность</option>
<option value="secret">Тайна</option>
<option value="protection">Защита</option>
<option value="chaos">Хаос</option>
</select>
</section>
<section class="card">
<h2>Эмоциональный профиль</h2>
<div id="sliders"></div>
</section>
<section class="card wide">
<button id="run">ПОДОБРАТЬ ПЕСНУ</button>
<div id="result" class="result"></div>
</section>
<section class="card wide">
<h2>Тестовые сценарии</h2>
<button id="testsBtn">Запустить 5 тестов</button>
<div id="tests" class="tests"></div>
</section>
</div>
<script type="module">
const dims=['romance','passion','obsession','danger','tenderness','tragedy','chaos'];
const labels={romance:'Романтика',passion:'Страсть',obsession:'Одержимость',danger:'Опасность',tenderness:'Нежность',tragedy:'Трагичность',chaos:'Хаос'};
const defaults={romance:7,passion:7,obsession:5,danger:5,tenderness:5,tragedy:4,chaos:5};
const profiles={
'Comfort Zone Killer (Want to be my regret)':{romance:7,passion:10,obsession:7,danger:9,tenderness:2,tragedy:4,chaos:8},
'Velvet Six-String Coffin':{romance:7,passion:10,obsession:9,danger:8,tenderness:2,tragedy:5,chaos:8},
'My Crimson Curl':{romance:9,passion:6,obsession:8,danger:2,tenderness:6,tragedy:9,chaos:3},
'Neon Glitch':{romance:9,passion:9,obsession:9,danger:8,tenderness:3,tragedy:9,chaos:9},
'Killer Comfort':{romance:7,passion:8,obsession:6,danger:10,tenderness:5,tragedy:3,chaos:8},
'Double-O':{romance:7,passion:9,obsession:7,danger:9,tenderness:2,tragedy:3,chaos:8},
'Midnight Sugar Raid':{romance:8,passion:7,obsession:4,danger:5,tenderness:6,tragedy:1,chaos:9},
'Harbor of the Damned':{romance:9,passion:5,obsession:5,danger:3,tenderness:10,tragedy:8,chaos:2},
'Flower Moon':{romance:9,passion:8,obsession:6,danger:8,tenderness:6,tragedy:5,chaos:7},
'Slow Burn, Baby':{romance:10,passion:8,obsession:5,danger:2,tenderness:7,tragedy:2,chaos:2}
};
const types={
'Comfort Zone Killer (Want to be my regret)':['forbidden-attraction','toxic-attraction'],
'Velvet Six-String Coffin':['toxic-attraction','mutual-obsession','enemies-to-lovers'],
'My Crimson Curl':['doomed-romance'],
'Neon Glitch':['forbidden-attraction','doomed-romance','mutual-obsession'],
'Killer Comfort':['partners-in-crime','danger'],
'Double-O':['rivals-to-lovers','partners-in-crime'],
'Midnight Sugar Raid':['partners-in-crime'],
'Harbor of the Damned':['hurt-comfort'],
'Flower Moon':['monster-romance','forbidden-attraction'],
'Slow Burn, Baby':['slow-burn']};
const quotes={
'Comfort Zone Killer (Want to be my regret)':'Want to be my regret?',
'Velvet Six-String Coffin':'A beautiful sin that I want to explore.',
'My Crimson Curl':'I’m watching from the sidelines, wishing you were mine.',
'Neon Glitch':'Our love’s the virus that the firewall can’t break.',
'Killer Comfort':'You’re the most beautiful crime I’ve ever seen.',
'Double-O':'You’re my secret weapon!',
'Midnight Sugar Raid':'We’ll rob the moon and blame the stars.',
'Harbor of the Damned':'I’ll build a harbor where you can stay.',
'Flower Moon':'I’m falling for the monster... under the flower moon!',
'Slow Burn, Baby':'You’re my slow burn, baby.'};
const root=document.getElementById('sliders');
for(const d of dims){const wrap=document.createElement('div');wrap.innerHTML=`<label>${labels[d]}: <span id="v-${d}">${defaults[d]}</span>/10</label><input id="${d}" type="range" min="0" max="10" value="${defaults[d]}">`;root.appendChild(wrap);wrap.querySelector('input').oninput=e=>document.getElementById('v-'+d).textContent=e.target.value}
function answers(){const a={pairing_types:[document.getElementById('type').value],themes:[document.getElementById('theme').value]};for(const d of dims)a[d]=+document.getElementById(d).value;return a}
function rank(a){return Object.entries(profiles).map(([title,p])=>{let score=0;const reasons=[];if(types[title].includes(a.pairing_types[0])){score+=30;reasons.push('совпадает динамика')}for(const d of dims){score+=Math.max(0,10-Math.abs(a[d]-p[d]))*1.5}return{title,score:+score.toFixed(2),reasons}}).sort((x,y)=>y.score-x.score)}
function render(){const r=rank(answers());const w=r[0];document.getElementById('result').innerHTML=`<div class="song">${w.title}</div><div class="quote">«${quotes[w.title]}»</div><div class="score">Счёт: ${w.score}</div><div>${w.reasons.map(x=>`<div class="reason">• ${x}</div>`).join('')}</div><hr><b>TOP-5 для отладки:</b><ol>${r.slice(0,5).map(x=>`<li>${x.title} — ${x.score}</li>`).join('')}</ol>`}
document.getElementById('run').onclick=render;
const scenarios=[
['Враги → любовники',{type:'enemies-to-lovers',theme:'jealousy',romance:7,passion:10,obsession:9,danger:8,tenderness:2,tragedy:5,chaos:8}],
['Healing',{type:'hurt-comfort',theme:'protection',romance:9,passion:5,obsession:5,danger:3,tenderness:10,tragedy:8,chaos:2}],
['Токсичная одержимость',{type:'toxic-attraction',theme:'obsession',romance:8,passion:10,obsession:10,danger:9,tenderness:1,tragedy:7,chaos:8}],
['Сообщники',{type:'partners-in-crime',theme:'chaos',romance:8,passion:7,obsession:4,danger:5,tenderness:6,tragedy:1,chaos:10}],
['Обречённая любовь',{type:'doomed-romance',theme:'secret',romance:9,passion:9,obsession:9,danger:8,tenderness:3,tragedy:10,chaos:8}]
];
document.getElementById('testsBtn').onclick=()=>{document.getElementById('tests').textContent=scenarios.map(([name,a])=>{const r=Object.entries(profiles).map(([title,p])=>{let s=types[title].includes(a.type)?30:0;for(const d of dims)s+=Math.max(0,10-Math.abs(a[d]-p[d]))*1.5;return[title,+s.toFixed(2)]}).sort((x,y)=>y[1]-x[1]);return `${name}\n  1. ${r[0][0]} (${r[0][1]})\n  2. ${r[1][0]} (${r[1][1]})\n  3. ${r[2][0]} (${r[2][1]})\n`}).join('\n')}
</script>
</body>
</html>
