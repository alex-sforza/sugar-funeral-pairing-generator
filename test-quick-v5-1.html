<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Funeral — v5.1</title>
<style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 18px;background:#f6f1eb;color:#211d1b}button{padding:12px 18px;margin:5px;border:0;border-radius:10px;cursor:pointer;background:#211d1b;color:white}button:hover{opacity:.88}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0001}.bar{height:8px;background:#ddd;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#211d1b}.muted{color:#777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.score{font-size:1.15em;font-weight:700}.pill{display:inline-block;background:#eee;padding:5px 9px;border-radius:999px;margin:3px}</style></head>
<body><h1>Sugar Funeral — pairing generator v5.1</h1><p class="muted">Тестовая версия: профиль пары → TOP-3 динамики → песня. Не меняет основной генератор.</p>
<div><button onclick="runControls()">▶ ВСЕ КОНТРОЛЬНЫЕ</button><button onclick="runRandom()">✦ 10 СЛУЧАЙНЫХ</button></div><div id="out"></div>
<script>
const dyn=['соперничество','тайна','преданность','власть','исцеление','бунт','игра','обречённость','хищник × добыча','близость','сообщничество','дистанция'];
const emo=['романтика','страсть','одержимость','опасность','нежность','трагичность','хаос'];
const types={
'Враги → любовники':{соперничество:10,власть:8,страсть:8,близость:6,опасность:5},'Hurt × comfort':{исцеление:10,нежность:9,преданность:9,трагичность:6},'Токсичная одержимость':{одержимость:10,опасность:9,'хищник × добыча':9,власть:8,страсть:10},'Сообщники':{сообщничество:10,игра:8,бунт:8,хаос:8},'Обречённая любовь':{обречённость:10,трагичность:10,романтика:8,нежность:6},'Запретная связь':{тайна:10,опасность:7,романтика:8,близость:7},'Slow burn':{близость:9,дистанция:7,романтика:8,нежность:8,страсть:6},'Монстр × принимающий':{'хищник × добыча':9,опасность:8,нежность:7,близость:8},'Власть × власть':{власть:10,соперничество:9,страсть:8,игра:6},'Тайный роман':{тайна:10,романтика:8,близость:7,дистанция:7},'Хаотичная пара':{хаос:10,игра:9,бунт:8,страсть:7},'Защитник':{преданность:10,власть:5,близость:8,нежность:9,опасность:5}};
const songs=[['All’s Fair (In Love and War)',{романтика:7,страсть:8,одержимость:4,опасность:6,нежность:4,трагичность:6,хаос:5},{соперничество:10,власть:8,тайна:3,близость:5,бунт:5,обречённость:5}],['By the Firelight',{романтика:9,страсть:5,одержимость:2,опасность:2,нежность:10,трагичность:7,хаос:1},{исцеление:10,преданность:9,близость:10,дистанция:3,тайна:2}],['Venomous',{романтика:5,страсть:10,одержимость:10,опасность:10,нежность:1,трагичность:7,хаос:7},{'хищник × добыча':10,власть:9,близость:8,соперничество:7,обречённость:6}],['Wanted and Wild',{романтика:6,страсть:9,одержимость:5,опасность:7,нежность:2,трагичность:3,хаос:10},{сообщничество:10,игра:9,бунт:10,власть:5}],['After the Lanterns',{романтика:10,страсть:6,одержимость:5,опасность:3,нежность:8,трагичность:10,хаос:2},{обречённость:10,дистанция:8,преданность:8,близость:7}],['Cold December Thirst',{романтика:8,страсть:8,одержимость:7,опасность:8,нежность:2,трагичность:6,хаос:4},{тайна:10,близость:8,'хищник × добыча':7,обречённость:5}],['Unwrapped',{романтика:9,страсть:6,одержимость:3,опасность:2,нежность:9,трагичность:4,хаос:2},{близость:10,дистанция:7,тайна:4,исцеление:7}],['Zankyō',{романтика:6,страсть:7,одержимость:7,опасность:8,нежность:6,трагичность:7,хаос:4},{'хищник × добыча':9,близость:8,тайна:6,обречённость:6}],['Obey me',{романтика:5,страсть:9,одержимость:7,опасность:7,нежность:2,трагичность:4,хаос:5},{власть:10,соперничество:8,'хищник × добыча':6,игра:7}],['The Beautiful Debt',{романтика:8,страсть:7,одержимость:6,опасность:6,нежность:5,трагичность:6,хаос:3},{тайна:10,близость:7,дистанция:7,власть:5}],['Lullaby for the Wicked',{романтика:6,страсть:8,одержимость:8,опасность:9,нежность:3,трагичность:7,хаос:6},{тайна:8,'хищник × добыча':8,игра:7,опасность:8}],['My Crimson Curl',{романтика:8,страсть:7,одержимость:5,опасность:4,нежность:8,трагичность:5,хаос:3},{близость:8,преданность:7,тайна:4}],['Killer Comfort',{романтика:7,страсть:8,одержимость:7,опасность:8,нежность:7,трагичность:5,хаос:4},{'хищник × добыча':9,исцеление:7,близость:8}],['Nightwave Radio',{романтика:7,страсть:6,одержимость:4,опасность:4,нежность:5,трагичность:5,хаос:6},{тайна:9,дистанция:8,близость:5}],['Checkmate',{романтика:6,страсть:8,одержимость:5,опасность:6,нежность:2,трагичность:4,хаос:6},{власть:10,соперничество:10,игра:9}],['Spank-o-Tronic',{романтика:4,страсть:10,одержимость:7,опасность:5,нежность:1,трагичность:2,хаос:9},{игра:10,власть:8,близость:8}],['Soldier of Love',{романтика:10,страсть:5,одержимость:4,опасность:3,нежность:8,трагичность:7,хаос:1},{преданность:10,исцеление:8,близость:7,обречённость:6}],['Dr. Rx',{романтика:7,страсть:6,одержимость:5,опасность:5,нежность:6,трагичность:6,хаос:4},{исцеление:9,тайна:8,близость:7}],['Spoilers! Alert!',{романтика:7,страсть:7,одержимость:4,опасность:4,нежность:5,трагичность:4,хаос:8},{игра:9,тайна:7,сообщничество:6}],['My citadel',{романтика:8,страсть:6,одержимость:4,опасность:3,нежность:9,трагичность:6,хаос:2},{преданность:10,защита:10,близость:9}]];
function score(p,s){let e=0,d=0;for(const k of emo)e+=1-Math.abs((p[k]??5)-(s[1][k]??5))/10;for(const k of dyn)d+=1-Math.abs((p[k]??5)-(s[2][k]??5))/10;return 45*e/emo.length+35*d/dyn.length+20*(Object.keys(p).filter(k=>dyn.includes(k)).reduce((a,k)=>a+((s[2][k]??5)/10),0)/(Object.keys(p).filter(k=>dyn.includes(k)).length||1));}
function profile(type){let p={};for(const k of emo)p[k]=5;for(const k of dyn)p[k]=5;for(const [k,v] of Object.entries(types[type]||{})){if(emo.includes(k))p[k]=v;else p[k]=v}return p}
function randomP(){let p={};for(const k of [...emo,...dyn])p[k]=Math.floor(Math.random()*11);return p}
function classify(p){return Object.entries(types).map(([n,w])=>[n,Object.entries(w).reduce((a,[k,v])=>a+Math.min(v,p[k]??5),0)/Object.values(w).reduce((a,v)=>a+v,0)*100]).sort((a,b)=>b[1]-a[1]).slice(0,3)}
function render(title,p){let ranked=songs.map(s=>[s[0],score(p,s)]).sort((a,b)=>b[1]-a[1]).slice(0,5),c=classify(p);return `<div class="card"><h2>${title}</h2><p><b>Динамика:</b> ${c.map((x,i)=>`${i+1}. ${x[0]} — ${x[1].toFixed(0)}%`).join(' · ')}</p>${ranked.map((x,i)=>`<div><span class="score">${i+1}. ${x[0]} — ${x[1].toFixed(1)}</span><div class="bar"><i style="width:${Math.min(100,x[1])}%"></i></div></div>`).join('')}</div>`}
function runControls(){document.getElementById('out').innerHTML=Object.keys(types).map(t=>render(t,profile(t))).join('')}
function runRandom(){let out='';for(let i=1;i<=10;i++)out+=render('Случайная пара #'+i,randomP());document.getElementById('out').innerHTML=out}
</script></body></html>
