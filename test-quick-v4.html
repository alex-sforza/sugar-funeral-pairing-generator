<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Funeral — калибровка v4</title><style>body{font:15px/1.45 Arial,sans-serif;max-width:1200px;margin:auto;padding:24px;background:#f5f1ef;color:#251f22}.card{background:white;border-radius:16px;padding:20px;margin:0 0 14px;box-shadow:0 3px 16px #0001}button{border:0;border-radius:9px;padding:10px 14px;margin:4px;background:#282124;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.song{padding:10px 0;border-bottom:1px solid #eee}.muted{color:#756b70}.big{font-size:21px;font-weight:800}.pill{display:inline-block;background:#eee8ea;border-radius:20px;padding:4px 8px;margin:3px;font-size:12px}.why{font-size:12px;color:#756b70}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="card"><h1>SUGAR FUNERAL · БЫСТРЫЙ ПРОГОН v4</h1><p class="muted">Песня выбирается по единому профилю истории: эмоции + динамика + сюжетные мотивы. Тип пейринга больше не даёт песне фиксированного бонуса.</p><button onclick="runControl()">▶ ВСЕ КОНТРОЛЬНЫЕ</button><button onclick="runRandom()">✦ 10 СЛУЧАЙНЫХ</button><button onclick="clearAll()">ОЧИСТИТЬ</button><div id="status" class="muted">Загрузка…</div></div><div class="card"><h2>Контрольные истории</h2><div id="buttons" class="grid"></div></div><div id="out"></div><script>

['🖤 Токсичная одержимость','toxic-attraction',{romance:7,passion:10,obsession:10,danger:9,tenderness:2,tragedy:7,chaos:7},{conflict:7,secrecy:3,devotion:7,control:8,healing:2,rebellion:5,playfulness:4,fatalism:7,predation:7,intimacy:8,crime:2,distance:2}],
['🔥 Сообщники','partners-in-crime',{romance:7,passion:8,obsession:5,danger:7,tenderness:3,tragedy:3,chaos:10},{conflict:3,secrecy:6,devotion:7,control:4,healing:1,rebellion:10,playfulness:9,fatalism:2,predation:2,intimacy:7,crime:10,distance:1}],
['🥀 Обречённая любовь','doomed-romance',{romance:10,passion:8,obsession:8,danger:6,tenderness:5,tragedy:10,chaos:4},{conflict:4,secrecy:5,devotion:9,control:2,healing:3,rebellion:3,playfulness:1,fatalism:10,predation:2,intimacy:9,crime:1,distance:8}],

['🩸 Монстр × принимающий','monster-romance',{romance:8,passion:7,obsession:7,danger:10,tenderness:7,tragedy:8,chaos:5},{conflict:4,secrecy:5,devotion:9,control:3,healing:7,rebellion:2,playfulness:2,fatalism:6,predation:10,intimacy:8,crime:1,distance:4}],
['♟️ Власть × власть','power-dynamic',{romance:6,passion:9,obsession:7,danger:8,tenderness:1,tragedy:4,chaos:6},{conflict:9,secrecy:2,devotion:3,control:10,healing:1,rebellion:5,playfulness:8,fatalism:2,predation:5,intimacy:7,crime:2,distance:2}],

['🛡️ Защитник × тот, кого нельзя потерять','protective-romance',{romance:8,passion:6,obsession:5,danger:5,tenderness:8,tragedy:5,chaos:2},{conflict:3,secrecy:2,devotion:10,control:4,healing:8,rebellion:1,playfulness:1,fatalism:4,predation:4,intimacy:8,crime:2,distance:2}]
];let songs=[],profiles=[],results=[];
const map={conflict:['enemies-to-lovers','rivals-to-lovers','power-struggle','provocation','competition','mind-games','challenge','spite','battle-couple'],secrecy:['secret-romance','secret-connection','secret-date','forbidden-love','forbidden-attraction','secret-identities','mystery-romance','privacy','secrets','masks','distance'],devotion:['devoted-love','eternal-love','devotion','exclusive-bond','protective-romance','battle-couple','loyalty','sacrifice','acceptance','creation-and-devotion'],control:['power-dynamic','power-struggle','obsession','possessive-romance','possessive-love','control','surrender','challenge','authority','discipline'],healing:['hurt-comfort','healing-romance','mutual-healing','sanctuary','repair','pattern-breaking','comfort','trust','acceptance','creation-and-devotion'],rebellion:['rule-breakers','runaways','wild-romance','escape','rebellion','freedom','chaotic-romance','playful-romance','disappearance'],playfulness:['playful-romance','chaotic-romance','dark-comedy','comedic-kink','flirty-romance','teasing','mischief','games','playful-danger','wonderland'],fatalism:['doomed-romance','temporary-love','tragic-romance','heartbreak','bittersweet','finality','inevitability','separation','temporary','damage'],predation:['monster-romance','predator-and-devotee','predatory-romance','hunt-and-hunted','dangerous-attraction','fatal-attraction','killer-romance','predator','hunt','hunger','venom'],intimacy:['sensual-romance','intimacy','slow-burn','friends-to-lovers','guarded-heart','connection','long-distance-romance','devotion','kiss','glances','anticipation','revelation'],crime:['partners-in-crime','runaways','crime','killer-romance','murder','criminal','wild-romance'],distance:['long-distance-romance','separation','distance','secret-connection','loneliness','radio','night','escape']};
const themeMap={'devotion':['devotion','intimacy'],'healing':['healing'],'eternity':['devotion','fatalism'],'temptation':['predation','rebellion'],'rebellion':['rebellion'],'danger':['predation','conflict'],'seduction':['intimacy','predation'],'possession':['control','predation'],'chaos':['rebellion','playfulness'],'desire':['intimacy','predation'],'restraint':['control','intimacy'],'trust':['devotion','healing','intimacy'],'hunger':['predation','obsession'],'predator':['predation'],'loyalty':['devotion'],'lust':['passion','predation'],'independence':['rebellion'],'memory':['distance','fatalism'],'separation':['distance','fatalism'],'jealousy':['obsession','conflict'],'longing':['distance','fatalism'],'repetition':['fatalism','obsession'],'rush':['playfulness','predation'],'heartbreak':['fatalism','distance'],'temporary':['fatalism'],'loneliness':['distance','healing'],'rescue':['healing','devotion'],'sanctuary':['healing','devotion'],'freedom':['rebellion'],'crime':['crime'],'escape':['rebellion','distance'],'boundaries':['control','healing'],'vulnerability':['intimacy','healing'],'patience':['intimacy','healing'],'affection':['devotion','playfulness'],'games':['playfulness','conflict'],'possessiveness':['control','obsession'],'addiction':['obsession','predation'],'chemistry':['intimacy','passion'],'craving':['obsession','predation'],'venom':['predation','conflict'],'spite':['conflict'],'passion':['passion'],'damage':['fatalism','healing'],'risk':['predation','rebellion'],'teeth':['predation'],'mutuality':['devotion','intimacy'],'layers':['intimacy'],'anticipation':['intimacy'],'revelation':['intimacy','secrecy'],'warning':['danger','secrecy'],'moon':['secrecy','predation'],'hunt':['predation'],'transformation':['predation'],'therapy':['healing'],'connection':['intimacy','devotion'],'masks':['secrecy'],'secrets':['secrecy'],'truth':['intimacy','secrecy'],'mystery':['secrecy'],'magic':['secrecy','playfulness'],'fascination':['obsession','intimacy'],'night':['secrecy','intimacy'],'mischief':['playfulness','rebellion'],'kiss':['intimacy','passion'],'sweetness':['intimacy'],'glitch':['chaos','fatalism'],'virus':['obsession','fatalism'],'inevitability':['fatalism'],'vertigo':['passion','control'],'loss-of-control':['control','passion'],'wickedness':['predation'],'comfort':['healing'],'crown':['control','devotion'],'war':['conflict','rebellion'],'sacrifice':['devotion','fatalism'],'strategy':['conflict','control'],'competition':['conflict','playfulness'],'teasing':['playfulness','conflict'],'victory':['control','conflict'],'luck':['playfulness','rebellion'],'chance':['rebellion','fatalism'],'shot':['danger','fatalism'],'finality':['fatalism'],'murder':['crime','predation'],'radio':['distance'],'voice':['distance','intimacy'],'darkness':['secrecy','predation'],'dance':['playfulness','intimacy'],'surrender':['control','intimacy'],'wish':['fatalism','obsession'],'consequence':['fatalism'],'fever':['obsession','passion'],'romance':['intimacy','devotion'],'warning':['danger','secrecy']};
function vecSong(s){let v=Object.fromEntries(D.map(x=>[x,0]));for(const t of [...(s.pairing_types||[]),...(s.themes||[])]){D.forEach(d=>{if((map[d]||[]).includes(t))v[d]+=2});(themeMap[t]||[]).forEach(d=>v[d]+=1)}let m=Math.max(1,...Object.values(v));D.forEach(d=>v[d]=v[d]/m*10);return v}
function dist(a,b,keys){let sum=0;for(const k of keys){let d=(a[k]||0)-(b[k]||0);sum+=d*d}return 100-Math.sqrt(sum/(keys.length*100))*100}
function tagDetail(p,s){let hits=0,n=0;for(const t of s.themes||[]){for(const d of themeMap[t]||[]){let e=d==='predation'?'danger':d==='control'||d==='obsession'?'obsession':d==='fatalism'?'tragedy':d==='healing'||d==='devotion'||d==='intimacy'?'tenderness':d==='rebellion'||d==='playfulness'||d==='crime'?'chaos':'romance';hits+=10-Math.abs((p[e]||0)-5);n++}}return n?Math.max(0,Math.min(20,hits/n*2)):0}
function rank(p,d){return songs.map(s=>{let sp=profiles.find(x=>x.title===s.title)||{};let em=dist(p,sp,E)*.50,dy=dist(d,s._dyn,D)*.35,de=tagDetail(p,s)*.15;return {s,total:em+dy+de,em,dy,de}}).sort((a,b)=>b.total-a.total)}
function typeOf(p,d){return presets.map(x=>({x,score:dist(p,x[2],E)*.55+dist(d,x[3],D)*.45})).sort((a,b)=>b.score-a.score)}
function render(r,label){let rr=rank(r.p,r.d),t=typeOf(r.p,r.d),top=rr[0],dyn=D.map(k=>[k,r.d[k]||0]).sort((a,b)=>b[1]-a[1]).slice(0,4);return `<div class="card"><h2>${label}</h2><div class="muted">Основная динамика: ${dyn.map(x=>labels[x[0]]).join(' × ')}</div><p><span class="big">${top.s.title}</span> · ${top.total.toFixed(1)}</p><div class="why">эмоции ${top.em.toFixed(1)} · динамика ${top.dy.toFixed(1)} · мотивы ${top.de.toFixed(1)}</div><p>Тип: <b>${t[0].x[0]}</b> · уверенность ${t[0].score.toFixed(0)}%</p><details><summary>TOP-5 и профиль</summary>${rr.slice(0,5).map((x,i)=>`<div class="song"><b>${i+1}. ${x.s.title}</b> — ${x.total.toFixed(1)}<div class="why">эмоции ${x.em.toFixed(1)} · динамика ${x.dy.toFixed(1)} · мотивы ${x.de.toFixed(1)}</div></div>`).join('')}<div>${E.map(k=>`<span class="pill">${k} ${r.p[k].toFixed(1)}</span>`).join('')}</div></details></div>`}
function show(){document.getElementById('out').innerHTML=results.map(x=>render(x.r,x.n)).join('')}
function runControl(){results=presets.map(x=>({n:x[0],r:{p:x[2],d:x[3]}}));show()}
function runRandom(){results=Array.from({length:10},(_,i)=>{let p=Object.fromEntries(E.map(k=>[k,+((Math.random()*10).toFixed(1))]));let d=Object.fromEntries(D.map(k=>[k,+((Math.random()*10).toFixed(1))]));return {n:'🎲 Случайная пара '+(i+1),r:{p,d}}});show()}
function clearAll(){results=[];show()}
async function load(){try{let [a,b]=await Promise.all([fetch('data/sugar-funeral-songs.json').then(x=>x.json()),fetch('data/song-profiles.json').then(x=>x.json())]);songs=a.songs;profiles=b.profiles;songs.forEach(s=>s._dyn=vecSong(s));document.getElementById('status').innerHTML=`Загружено <b>${songs.length}</b> песен · <b>${profiles.length}</b> эмоциональных паспортов.`;document.getElementById('buttons').innerHTML=presets.map((x,i)=>`<button onclick="results=[{n:presets[${i}][0],r:{p:presets[${i}][2],d:presets[${i}][3]}}];show()">${x[0]}</button>`).join('')}catch(e){document.getElementById('status').textContent='Ошибка: '+e.message}}load();
</script></body></html>
