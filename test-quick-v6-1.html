<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Funeral — V6.1</title><style>body{font-family:system-ui,sans-serif;max-width:1180px;margin:auto;padding:24px;background:#f5f0ec;color:#241d20}.head,.card{background:#fff;border-radius:16px;padding:20px;margin:0 0 16px;box-shadow:0 3px 18px #0001}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#241d20;color:#fff;cursor:pointer;margin:4px}.song{padding:9px 0;border-bottom:1px solid #eee}.score{font-weight:800;font-size:18px}.bar{height:7px;background:#e8e2df;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#241d20}.muted,.why{color:#70666a}</style></head><body><div class="head"><h1>SUGAR FUNERAL · V6.1</h1><p class="muted">Градуированный сюжетный профиль + штраф за противоречия.</p><p id="status">Загрузка базы…</p><button onclick="runControls()">▶ ВСЕ КОНТРОЛЬНЫЕ</button><button onclick="runRandom()">✦ 10 СЛУЧАЙНЫХ</button><button onclick="clearOut()">× ОЧИСТИТЬ</button></div><div id="out"></div><script>
let songs=[],profiles=[];const E=['romance','passion','obsession','danger','tenderness','tragedy','chaos'],D=['rivalry','mystery','devotion','power','healing','rebellion','play','doom','predator','intimacy','crime','distance'];
const tagDim={rivalry:['rivals-to-lovers','mind-games','power-struggle','competition','cat-and-mouse'],mystery:['mystery-romance','secret-identities','secret-connection','fate'],devotion:['devoted-love','eternal-love','devotion','protective-romance','battle-couple','healing-romance','soulmates','acceptance','power-couple','creation-and-devotion'],power:['power-dynamic','power-couple','power-struggle','provocation','workplace-romance','rivals-to-lovers'],healing:['hurt-comfort','healing-romance','healing','mutual-healing','pattern-breaking','second-chance','acceptance'],rebellion:['rule-breakers','runaways','rebellious-romance','escape','destructive-love'],play:['playful-romance','playful-danger','chaotic-romance','mind-games','flirty-romance','holiday-flirt','comedic-kink'],doom:['doomed-romance','last-night','destructive-love','finality','farewell','eternal-devotion'],predator:['monster-romance','predator-and-devotee','predatory-romance','hunt-and-hunted','killer-romance','dangerous-romance','fatal-attraction'],intimacy:['sensual-romance','intimacy','slow-burn','secret-date','mutual-desire','possessive-romance'],crime:['partners-in-crime','cop-and-criminal','spy-romance','killer-romance'],distance:['long-distance-romance','loneliness','memory','exes','unrequited-love','bittersweet']};
const presets={'⚔️ Враги → любовники':{rivalry:10,power:8,passion:9,obsession:6,danger:7,intimacy:6},'🤍 Hurt × comfort':{healing:10,tenderness:10,devotion:9,tragedy:6,intimacy:8},'🖤 Токсичная одержимость':{obsession:10,danger:10,power:8,predator:8,passion:10,intimacy:8},'🔥 Сообщники':{crime:10,rebellion:9,play:8,chaos:9,devotion:7},'🥀 Обречённая любовь':{doom:10,tragedy:10,romance:10,devotion:8,distance:7},'🔒 Запретная связь':{mystery:10,rebellion:8,danger:8,intimacy:8,romance:8},'🌙 Slow burn':{intimacy:10,devotion:8,mystery:5,tenderness:8,passion:7},'🩸 Монстр × принимающий':{predator:10,devotion:8,intimacy:8,danger:8,tenderness:8},'♟️ Власть × власть':{power:10,rivalry:9,play:8,passion:9,intimacy:7},'🌫️ Тайный роман':{mystery:10,distance:7,intimacy:8,devotion:7,romance:9},'🎲 Хаотичная пара':{chaos:10,play:10,rebellion:9,crime:6,passion:8},'🛡️ Защитник':{devotion:10,healing:7,intimacy:8,tenderness:10,danger:5}};
const dimE={predator:{danger:9,obsession:8,passion:7,tenderness:2},crime:{danger:7,chaos:8},doom:{tragedy:10,romance:8},distance:{tragedy:6,obsession:5},healing:{tenderness:10,romance:8,tragedy:5},intimacy:{romance:8,passion:8,obsession:5},mystery:{obsession:6,danger:5},power:{passion:8,obsession:7,danger:6},rebellion:{chaos:9,danger:7},rivalry:{passion:8,chaos:6},play:{chaos:8,passion:7},devotion:{romance:9,tenderness:9,tragedy:3},chaos:{chaos:10},slow:{romance:9,tenderness:8,passion:6}};
const conflicts={healing:['danger','predator','crime'],tenderness:['danger','predator'],devotion:['mutual-destruction','toxic-romance'],distance:['intimacy','mutual-desire'],chaos:['healing'],doom:['escape'],predator:['acceptance']};
function ep(s){let p=profiles.find(x=>x.title===s.title);return p||Object.fromEntries(E.map(k=>[k,5]))}
function matrix(s){let o=Object.fromEntries(D.map(k=>[k,5])),tags=[...(s.pairing_types||[]),...(s.themes||[])];for(const d of D){let h=(tagDim[d]||[]).filter(t=>tags.includes(t)).length;o[d]=Math.min(10,3.5+h*1.6)}return o}
function make(raw){let e=Object.fromEntries(E.map(k=>[k,5])),d=Object.fromEntries(D.map(k=>[k,5]));for(const[k,v]of Object.entries(raw)){if(k in d)d[k]=v;else if(k in e)e[k]=v;else if(dimE[k]){d[k]=v;for(const[a,b]of Object.entries(dimE[k]))e[a]=Math.max(e[a],Math.min(10,b))}}return{e,d}}
function score(s,p){let se=ep(s),sm=matrix(s),es=0,ds=0;for(const k of E)es+=1-Math.abs(p.e[k]-se[k])/10;for(const k of D)ds+=1-Math.abs(p.d[k]-sm[k])/10;let tags=[...(s.pairing_types||[]),...(s.themes||[])],strong=Object.entries(p.d).filter(([,v])=>v>=8).map(([k])=>k),hits=strong.reduce((n,k)=>n+(tagDim[k]||[]).filter(t=>tags.includes(t)).length,0),wanted=strong.reduce((n,k)=>n+(tagDim[k]||[]).length,0),specificity=Math.min(1,hits/Math.max(4,wanted*.18));let contradiction=0;for(const[k,bad]of Object.entries(conflicts)){if((p.d[k]||0)>=8&&bad.some(x=>tags.includes(x)))contradiction+=1}let penalty=Math.min(20,contradiction*5);return{total:Math.max(0,100*(.35*es/E.length+.30*ds/D.length+.25*specificity+.10*(es/E.length))-penalty,e:100*es/E.length,d:100*ds/D.length,sp:100*specificity,pen:penalty}}
function classify(p){return Object.entries(presets).map(([n,x])=>{let q=0,z=0;for(const[k,v]of Object.entries(x)){let a=p.d[k]??p.e[k]??5;q+=Math.min(v,a);z+=v}return[n,100*q/z]}).sort((a,b)=>b[1]-a[1]).slice(0,3)}
function render(name,raw){let p=make(raw),cl=classify(p),r=songs.map(s=>({s,...score(s,p)})).sort((a,b)=>b.total-a.total).slice(0,7);return `<div class="card"><h2>${name}</h2><p><b>TOP-3 динамики:</b> ${cl.map((x,i)=>`${i+1}. ${x[0]} — ${x[1].toFixed(0)}%`).join(' · ')}</p>${r.map((x,i)=>`<div class="song"><span class="score">${i+1}. ${x.s.title} — ${x.total.toFixed(1)}</span><div class="bar"><i style="width:${x.total}%"></i></div><div class="why">эмоции ${x.e.toFixed(1)} · динамика ${x.d.toFixed(1)} · сюжет ${x.sp.toFixed(1)} · противоречия −${x.pen.toFixed(1)}</div></div>`).join('')}</div>`}
function randomP(){let p={};for(const k of E)p[k]=+(Math.random()*10).toFixed(1);for(const k of D)p[k]=+(Math.random()*10).toFixed(1);return p}function runControls(){out.innerHTML=Object.entries(presets).map(([n,p])=>render(n,p)).join('')}function runRandom(){out.innerHTML=Array.from({length:10},(_,i)=>render('🎲 Случайная пара #'+(i+1),randomP())).join('')}function clearOut(){out.innerHTML=''}
async function load(){try{let[a,b]=await Promise.all([fetch('data/sugar-funeral-songs.json').then(r=>r.json()),fetch('data/song-profiles.json').then(r=>r.json())]);songs=a.songs;profiles=b.profiles;status.innerHTML=`Загружено: <b>${songs.length} песен</b> · паспортов: <b>${profiles.length}</b>`}catch(e){status.textContent='Ошибка загрузки: '+e.message}}load();</script></body></html>
