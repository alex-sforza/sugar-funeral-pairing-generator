<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Funeral — калибровка v2</title>
<style>
body{font-family:Arial,sans-serif;max-width:1220px;margin:auto;padding:24px;background:#f4f0ee;color:#241d20}.head,.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 18px #0001;margin-bottom:16px}.head h1{margin:0 0 6px}.sub,.meta,.note{color:#6b6165}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#241d20;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.result h3{margin:0 0 6px}.score{font-size:22px;font-weight:800}.song{padding:10px 0;border-bottom:1px solid #eee}.song:last-child{border:0}.pill{display:inline-block;background:#eee7e9;border-radius:99px;padding:5px 9px;margin:3px;font-size:12px}.profile{display:flex;flex-wrap:wrap;margin-top:10px}.profile .pill b{margin-left:4px}.rank{font-weight:700}.bar{height:7px;background:#eee7e9;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#241d20}.details{margin-top:12px}.why{font-size:12px;color:#6b6165;margin-top:3px}.type{font-size:18px;font-weight:800}.warn{padding:10px 12px;background:#fff7df;border-radius:10px;margin-top:12px}.ok{font-weight:700}.empty{padding:30px;text-align:center;color:#777}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="head"><h1>SUGAR FUNERAL · БЫСТРЫЙ ПРОГОН v2</h1><div class="sub">Новая модель: сначала строим профиль пары, затем определяем динамику и только после этого ищем песню. 10/10 больше не должно быть нормой.</div><div id="status">Загрузка базы…</div><div class="controls"><button onclick="runAll()">▶ ПРОГНАТЬ ВСЕ ВАРИАНТЫ</button><button onclick="runRandom()">✦ 10 СЛУЧАЙНЫХ ПАР</button><button onclick="clearResults()">ОЧИСТИТЬ</button></div></div>
<div class="card"><h2>Контрольные сценарии</h2><div id="presets" class="grid"></div></div><div id="results"></div>
<script>
let songs=[],profiles=[],allResults=[];
const dims=['romance','passion','obsession','danger','tenderness','tragedy','chaos'];
const archetypes={
'enemies-to-lovers':{name:'Враги → любовники',v:{romance:7,passion:9,obsession:7,danger:7,tenderness:3,tragedy:5,chaos:6}},
'hurt-comfort':{name:'Healing / hurt × comfort',v:{romance:8,passion:5,obsession:3,danger:2,tenderness:10,tragedy:5,chaos:2}},
'toxic-attraction':{name:'Токсичная одержимость',v:{romance:7,passion:10,obsession:10,danger:9,tenderness:2,tragedy:7,chaos:7}},
'partners-in-crime':{name:'Сообщники',v:{romance:7,passion:8,obsession:5,danger:7,tenderness:3,tragedy:3,chaos:10}},
'doomed-romance':{name:'Обречённая любовь',v:{romance:10,passion:8,obsession:8,danger:6,tenderness:5,tragedy:10,chaos:4}},
'forbidden-attraction':{name:'Запретная связь',v:{romance:8,passion:9,obsession:7,danger:7,tenderness:4,tragedy:7,chaos:3}},
'slow-burn':{name:'Slow burn',v:{romance:8,passion:6,obsession:4,danger:1,tenderness:8,tragedy:2,chaos:2}},
'monster-romance':{name:'Монстр × принимающий',v:{romance:8,passion:7,obsession:7,danger:10,tenderness:7,tragedy:8,chaos:5}},
'power-dynamic':{name:'Власть × власть',v:{romance:6,passion:9,obsession:7,danger:8,tenderness:1,tragedy:4,chaos:6}},
'secret-romance':{name:'Тайные отношения',v:{romance:8,passion:8,obsession:6,danger:5,tenderness:5,tragedy:6,chaos:3}},
'protective-romance':{name:'Защитник × тот, кого нельзя потерять',v:{romance:8,passion:6,obsession:5,danger:5,tenderness:8,tragedy:5,chaos:2}}
};
const presets=[
['⚔️ Враги → любовники','Соперничество, искры, ревность, борьба за контроль','enemies-to-lovers'],
['🤍 Healing / hurt × comfort','Два человека становятся друг другу безопасным местом','hurt-comfort'],
['🖤 Токсичная одержимость','Притяжение, зависимость, ревность и невозможность остановиться','toxic-attraction'],
['🔥 Сообщники','Авантюра, преступления, свобода и «мы против всех»','partners-in-crime'],
['🥀 Обречённая любовь','Они знают, что это закончится плохо, но всё равно выбирают друг друга','doomed-romance'],
['🔒 Запретная связь','Правила, статус, тайна — и желание всё равно сильнее','forbidden-attraction'],
['🌙 Slow burn','Долго, осторожно, через дружбу и постепенно нарастающее напряжение','slow-burn'],
['🩸 Монстр × тот, кто его принимает','Опасность, инаковость, страх и неожиданная нежность','monster-romance'],
['♟️ Власть × власть','Никто не уступает, оба хотят контролировать игру','power-dynamic'],
['🌫️ Тайные отношения','Все вокруг не должны знать, а они учатся жить с двойной жизнью','secret-romance'],
['🎲 Хаотичная пара','Любая нормальная жизнь заканчивается приключением','partners-in-crime'],
['🛡️ Защитник × тот, кого нельзя потерять','Любовь проявляется через поступки, риск и защиту','protective-romance']
];
const themeToDim={
'devotion':'tenderness','healing':'tenderness','sanctuary':'tenderness','trust':'tenderness','comfort':'tenderness','repair':'tenderness','acceptance':'tenderness',
'desire':'passion','lust':'passion','seduction':'passion','chemistry':'passion','craving':'passion','kiss':'passion',
'possession':'obsession','obsession':'obsession','fixation':'obsession','jealousy':'obsession','hunger':'obsession','addiction':'obsession',
'danger':'danger','risk':'danger','predator':'danger','venom':'danger','spite':'danger','murder':'danger','knife-edge':'danger',
'heartbreak':'tragedy','longing':'tragedy','separation':'tragedy','damage':'tragedy','inevitability':'tragedy','finality':'tragedy','temporary':'tragedy',
'chaos':'chaos','freedom':'chaos','escape':'chaos','mischief':'chaos','madness':'chaos','games':'chaos','rebellion':'chaos',
'romance':'romance','love':'romance','devotion':'romance','connection':'romance','partnership':'romance'
};
const typeHints={
'enemies-to-lovers':['enemies-to-lovers','rivals-to-lovers','power-struggle','provocation','competition'],
'hurt-comfort':['hurt-comfort','healing-romance','mutual-healing','sanctuary','devoted-love'],
'toxic-attraction':['toxic-attraction','toxic-romance','mutual-obsession','obsession','red-flags','addictive-romance'],
'partners-in-crime':['partners-in-crime','runaways','wild-romance','chaotic-romance','escape'],
'doomed-romance':['doomed-romance','tragic-romance','destructive-love','heartbreak','temporary-love'],
'forbidden-attraction':['forbidden-attraction','forbidden-love','secret-romance','dangerous-attraction','rule-breakers'],
'slow-burn':['slow-burn','friends-to-lovers','tension','intimacy','guarded-heart'],
'monster-romance':['monster-romance','gothic-romance','acceptance','predator-and-devotee','hunt-and-hunted'],
'power-dynamic':['power-dynamic','power-struggle','mind-games','provocation','power-couple'],
'secret-romance':['secret-romance','secret-connection','secret-date','forbidden-love'],
'protective-romance':['protective-romance','devotion','battle-couple','mutual-protection','hurt-comfort']
};
function clamp(x){return Math.max(0,Math.min(10,x))}
function profileFromPreset(type){return {...archetypes[type].v}}
function inferType(p){let best=['slow-burn',Infinity];for(const [k,a] of Object.entries(archetypes)){let d=dims.reduce((s,d)=>s+Math.pow((p[d]||0)-a.v[d],2),0);if(d<best[1])best=[k,d]}return{type:best[0],distance:best[1]}}
function scoreSong(s,p,inferred){
 const sp=profiles.find(x=>x.title===s.title)||{};
 let emotion=0;for(const d of dims)emotion+=10-Math.abs((p[d]||0)-(sp[d]??5));
 emotion=Math.max(0,Math.min(40,emotion*40/(dims.length*10)));
 let semantic=0;const st=s.pairing_types||[];if(st.includes(inferred.type))semantic=35;else{for(const t of st){if((typeHints[inferred.type]||[]).includes(t)){semantic=Math.max(semantic,18)}}}
 let detail=0;for(const t of (s.themes||[])){const d=themeToDim[t];if(d)detail+=Math.max(0,5-Math.abs((p[d]||0)-(sp[d]??5)));}detail=Math.min(25,detail*25/20);
 return{title:s.title,total:semantic+detail+emotion,semantic,detail,emotion};
}
function rank(p){const inferred=inferType(p);return{inferred,ranked:songs.map(s=>scoreSong(s,p,inferred)).sort((a,b)=>b.total-a.total).slice(0,5)}}
function randomProfile(){const p={};for(const d of dims)p[d]=+(Math.random()*10).toFixed(1);return p}
function noisyProfile(base){const p={};for(const d of dims)p[d]=+clamp(base[d]+(Math.random()*4-2)).toFixed(1);return p}
function renderProfile(p){return '<div class="profile">'+dims.map(d=>`<span class="pill">${d}: <b>${p[d].toFixed(1)}/10</b></span>`).join('')+'</div>'}
function renderOne(label,desc,p,random=false){const r=rank(p),top=r.ranked[0];const confidence=Math.max(0,Math.min(100,100-Math.sqrt(r.inferred.distance)*7));return `<div class="card result"><h3>${label}</h3><div class="meta">${desc}</div><p class="ok">Профиль → <span class="type">${archetypes[r.inferred.type].name}</span> · уверенность ${confidence.toFixed(0)}%</p><div class="song"><div class="meta">ЛУЧШЕЕ СОВПАДЕНИЕ</div><b>№1 · ${top.title}</b> <span class="score">${top.total.toFixed(1)}</span><div class="why">смысл ${top.semantic.toFixed(1)} · детали ${top.detail.toFixed(1)} · эмоции ${top.emotion.toFixed(1)}</div></div><details class="details" open><summary>Показать TOP-5 и профиль</summary><div>${r.ranked.map((x,i)=>`<div class="song"><span class="rank">${i+1}. ${x.title} — ${x.total.toFixed(1)}</span><div class="why">смысл ${x.semantic.toFixed(1)} · детали ${x.detail.toFixed(1)} · эмоции ${x.emotion.toFixed(1)}</div></div>`).join('')}</div>${renderProfile(p)}<div class="note" style="margin-top:10px">Теперь 10/10 появляется только там, где профиль действительно экстремальный. Песня получает максимум 35 за смысловую близость, 25 за тематические детали и 40 за эмоциональный профиль.</div></details></div>`}
function runAll(){allResults=presets.map(([n,d,t])=>({n,d,p:profileFromPreset(t)}));renderResults()}
function runRandom(){allResults=Array.from({length:10},(_,i)=>({n:`🎲 Случайная пара ${i+1}`,d:'Случайный эмоциональный профиль — проверка разнообразия',p:randomProfile()}));renderResults()}
function renderResults(){document.getElementById('results').innerHTML=allResults.length?allResults.map(x=>renderOne(x.n,x.d,x.p)).join(''):'<div class="card empty">Запусти один из тестов выше.</div>'}
function clearResults(){allResults=[];renderResults()}
async function load(){try{const [a,b]=await Promise.all([fetch('data/sugar-funeral-songs.json').then(r=>r.json()),fetch('data/song-profiles.json').then(r=>r.json())]);songs=a.songs;profiles=b.profiles;document.getElementById('status').innerHTML=`Загружено: <b>${songs.length} песен</b> · эмоциональных паспортов: <b>${profiles.length}</b> · модель v2 готова.`;document.getElementById('presets').innerHTML=presets.map(([n,d,t])=>`<button class="preset" onclick="allResults=[{n:${JSON.stringify(n)},d:${JSON.stringify(d)},p:profileFromPreset('${t}')}];renderResults()"><b>${n}</b><span>${d}</span></button>`).join('')}catch(e){document.getElementById('status').innerHTML='Не удалось загрузить базу данных: '+e.message}}
load();
</script></body></html>
