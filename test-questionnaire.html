<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Funeral — тест анкеты</title>
<style>body{font-family:Arial,sans-serif;max-width:1050px;margin:auto;padding:24px;background:#f4f0ee;color:#241d20}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 3px 18px #0001;margin-bottom:18px}h1{margin:0 0 5px}.sub{color:#6b6165}.progress{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin:16px 0}.bar{height:100%;width:0;background:#241d20}.qnum{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#776b70}.question{font-size:25px;font-weight:800;line-height:1.25;margin:10px 0 18px}.option{display:block;padding:14px 16px;border:1px solid #ddd;border-radius:12px;margin:9px 0;cursor:pointer}.option:hover{background:#f7f3f4}.option input{margin-right:10px}.nav{display:flex;gap:10px;justify-content:space-between}.nav button,button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:#241d20;color:white}.secondary{background:#eee7e9}.hidden{display:none}.profile{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meter{background:#f3eff0;border-radius:10px;padding:10px}.meter b{display:flex;justify-content:space-between}.meter span{display:block;height:7px;background:#d8d0d3;border-radius:8px;margin-top:7px;overflow:hidden}.meter i{display:block;height:100%;background:#241d20}.tag{display:inline-block;background:#eee7e9;padding:6px 9px;border-radius:99px;margin:4px}.resultSong{font-size:28px;font-weight:800}.score{font-size:19px}.small{color:#6b6165}@media(max-width:700px){.profile{grid-template-columns:1fr}.question{font-size:21px}}</style></head>
<body>
<div class="card"><h1>SUGAR FUNERAL</h1><div class="sub">Тестовая анкета пары · 40 сценарных вопросов · скрытый профиль</div><div id="status">Загружаю…</div></div>
<div id="quiz" class="card hidden"><div class="qnum" id="qnum"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="options"></div><div class="nav"><button class="secondary" id="back">← НАЗАД</button><button class="primary" id="next">ДАЛЬШЕ →</button></div></div>
<div id="result" class="hidden"></div>
<script>
let data=null,songs=[],profiles=[],affinity=null,current=0,answers=[];
const dims=['romance','passion','obsession','danger','tenderness','tragedy','chaos','jealousy','forbiddenness','dependence','guilt','trust','protection','competition','power'];
const labels={romance:'Романтика',passion:'Страсть',obsession:'Одержимость',danger:'Опасность',tenderness:'Нежность',tragedy:'Трагичность',chaos:'Хаос',jealousy:'Ревность',forbiddenness:'Запретность',dependence:'Зависимость',guilt:'Вина',trust:'Доверие',protection:'Защита',competition:'Конкуренция',power:'Власть'};
const typeAliases={
'enemies-to-lovers':['enemies-to-lovers','rivals-to-lovers','power-struggle','dangerous-romance','toxic-attraction','provocation'],
'forbidden-attraction':['forbidden-attraction','forbidden-love','secret-romance','dangerous-attraction','dark-romance'],
'toxic-attraction':['toxic-attraction','toxic-romance','toxic-cycle','red-flags','addictive-romance','mutual-destruction'],
'partners-in-crime':['partners-in-crime','wild-romance','chaotic-romance','runaways','escape','killer-romance'],
'slow-burn':['slow-burn','friends-to-lovers','tension','intimacy','guarded-heart','sensual-romance'],
'doomed-romance':['doomed-romance','tragic-romance','last-night','destructive-love','temporary-love','heartbreak','eternal-devotion'],
'hurt-comfort':['hurt-comfort','healing-romance','mutual-healing','dark-tenderness','healing','cozy-romance','devoted-love'],
'monster-romance':['monster-romance','gothic-romance','dark-tenderness','predator-and-devotee','hunt-and-hunted','acceptance'],
'mutual-obsession':['mutual-obsession','obsessive-romance','possessive-love','possessive-romance','fixation','obsession'],
'rivals-to-lovers':['rivals-to-lovers','enemies-to-lovers','power-struggle','mind-games','seduction','provocation'],
'friends-to-lovers':['friends-to-lovers','slow-burn','healing-romance','devoted-love','intimacy'],
'protective-romance':['protective-romance','devotion','battle-couple','mutual-protection','hurt-comfort'],
'secret-romance':['secret-romance','secret-date','secret-connection','forbidden-love','privacy','secret-identities'],
'power-dynamic':['power-dynamic','power-struggle','possessive-love','mind-games','provocation','power-couple']};
function renderQ(){const q=data.questions[current];document.getElementById('qnum').textContent=`${q.block} · вопрос ${current+1} из ${data.questions.length}`;document.getElementById('bar').style.width=((current+1)/data.questions.length*100)+'%';document.getElementById('question').textContent=q.question;document.getElementById('options').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}>${o.text}</label>`).join('');document.getElementById('back').disabled=current===0;document.getElementById('next').textContent=current===data.questions.length-1?'ПОЛУЧИТЬ РЕЗУЛЬТАТ':'ДАЛЬШЕ →'}
function choose(){const el=document.querySelector('input[name=answer]:checked');if(!el)return false;answers[current]=+el.value;return true}
function next(){if(!choose())return;if(current<data.questions.length-1){current++;renderQ()}else{showResult()}}
document.getElementById('next').onclick=next;document.getElementById('back').onclick=()=>{if(current>0){current--;renderQ()}};
function buildProfile(){const p=Object.fromEntries(dims.map(d=>[d,0])),tags={};for(let i=0;i<answers.length;i++){const o=data.questions[i].options[answers[i]];for(const [d,v] of Object.entries(o.effects||{})){if(d in p)p[d]+=v}for(const t of o.tags||[])tags[t]=(tags[t]||0)+1}const maxes={};for(const d of dims)maxes[d]=Math.min(10,Math.round(p[d]));return {p:maxes,tags}}
function inferType(tags){let best={type:'',score:-1};for(const [type,list] of Object.entries(typeAliases)){let s=0;for(const t of list)s+=tags[t]||0;if(s>best.score)best={type,score:s}}return best}
function scoreSong(s,p,targetType){const semantic=(s.pairing_types||[]).includes(targetType)?50:Math.max(0,...(s.pairing_types||[]).map(t=>(affinity.related?.[targetType]?.[t])||0),0);let raw=0,n=0;const songP=profiles.find(x=>x.title===s.title);if(songP){for(const d of ['romance','passion','obsession','danger','tenderness','tragedy','chaos']){raw+=Math.max(0,10-Math.abs((p[d]||0)-(songP[d]||0)));n++}}const emotional=n?Math.min(30,raw*30/(n*10)):0;return {s,total:semantic+emotional,semantic,emotional}}
function showResult(){const {p,tags}=buildProfile(),it=inferType(tags),ranked=songs.map(s=>scoreSong(s,p,it.type)).sort((a,b)=>b.total-a.total).slice(0,5);const topTags=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,10);document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('result').innerHTML=`<div class="card"><div class="small">ВАШ ПРЕДВАРИТЕЛЬНЫЙ ТИП</div><h2>${it.type} <span class="small">(${it.score} совпадений)</span></h2><p class="small">Это технический результат анкеты. В финальной версии название типа будет красивым русским описанием, а песня будет учитывать также сюжетные детали.</p><h3>Эмоциональный профиль</h3><div class="profile">${dims.map(d=>`<div class="meter"><b><span style="height:auto;background:none;margin:0">${labels[d]}</span><span style="height:auto;background:none;margin:0">${p[d]}/10</span></b><span><i style="width:${p[d]*10}%"></i></span></div>`).join('')}</div><h3>Сюжетные маркеры</h3><div>${topTags.map(([t,n])=>`<span class="tag">${t} ×${n}</span>`).join('')}</div></div><div class="card"><div class="small">ПРЕДВАРИТЕЛЬНЫЙ TOP-5 ПЕСЕН</div>${ranked.map((x,i)=>`<p><b>${i+1}. ${x.s.title}</b> — <span class="score">${x.total.toFixed(1)}</span><br><span class="small">смысл ${x.semantic} · эмоции ${x.emotional.toFixed(1)}</span></p>`).join('')}<button class="primary" onclick="location.reload()">ПРОЙТИ СНОВА</button></div>`}
Promise.all([fetch('data/questionnaire.json').then(r=>r.json()),fetch('data/sugar-funeral-songs.json').then(r=>r.json()),fetch('data/song-profiles.json').then(r=>r.json()),fetch('data/pairing-affinity.json').then(r=>r.json())]).then(([q,s,p,a])=>{data=q;songs=s.songs||[];profiles=p.profiles||[];affinity=a;document.getElementById('status').textContent=`Готово: ${data.questions.length} вопросов · ${songs.length} песен`;document.getElementById('quiz').classList.remove('hidden');renderQ()}).catch(e=>document.getElementById('status').textContent='Ошибка загрузки: '+e.message);
</script></body></html>
